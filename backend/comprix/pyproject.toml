[project]
name = "comprix"
version = "0.1.0"
description = ""
authors = [
    {name = "paulosmandrade",email = "paulo.smandrade@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.142.2,<0.143.0)"
]

[tool.poetry]
packages = [{include = "comprix", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "typos (>=1.51.1,<2.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "zensical (>=0.0.68,<0.0.69)",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I','F','E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['src']
addopts = ['-p', 'no:warnings', '--cov=comprix', '--cov-context=test']

[tool.typos.files]
extend-exclude = ['*.md', 'migrations']

[tool.poe]
poetry_command = ""

[tool.poe.tasks]
lint = {cmd = "ruff check"}
format.sequence = [
    { cmd = "ruff check --fix"},
    { cmd = "ruff format"}
]
serve = "fastapi dev src/comprix/app.py"
test.sequence = [
    "lint",
    { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS"},
    { cmd  = "coverage html --show-contexts"}
]
